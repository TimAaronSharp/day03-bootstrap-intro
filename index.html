<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- NOTE Brings in all css from bootstrap using the web -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"
    defer></script>
  <!-- NOTE Make sure your css stylesheet loads after Bootstrap's -->
  <link rel="stylesheet" href="style.css">
  <title>Bootstrap Intro</title>
</head>

<body>
  <header>
    <!-- NOTE container or container-fluid class will always start your grid -->
    <div class="container">
      <!-- NOTE row classes are how we split a container up vertically -->
      <div class="row">
        <div class="col-2">
          <span>Boomerang</span>
        </div>
        <div class="col-8">
          <nav class="d-flex justify-content-between">
            <a href="">Home</a>
            <!-- NOTE href attribute can take in links and will navigate the user to that page when clicked -->
            <a href="https://unsplash.com/photos/gray-fish-on-white-coral-reef-CIV0DPeMc3w" target="_blank">Pages</a>
            <a href="">Portfolio</a>
            <a href="">Blog</a>
            <a href="">Shop</a>
            <a href="">Components</a>
            <a href="">Demos</a>
          </nav>
        </div>
        <div class="col-2">
          🛒🍔
        </div>
      </div>
    </div>
  </header>
</body>

</html>
